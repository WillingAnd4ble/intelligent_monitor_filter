services:
  db:
    image: pgvector/pgvector:pg18
    container_name: arxiv_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arxiv_intel
    ports:
      - "5433:5432"
    volumes:
      # PG 18+ uses /var/lib/postgresql (not /var/lib/postgresql/data) so it
      # can place data in a major-version-specific subdir (e.g. .../18/) and
      # support pg_upgrade --link cleanly. See docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: arxiv_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
