<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — arXiv Lens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body class="auth-body">
    <header class="auth-nav">
      <a href="index.html" class="brand" style="text-decoration: none; color: inherit">
        <div>arxiv<strong>lens</strong></div>
      </a>
    </header>

    <main class="auth-main">
      <div class="auth-card">
        <h1>Create account</h1>
        <form action="feed.html" method="get">
          <div class="form-field">
            <label for="reg-email">Email</label>
            <input id="reg-email" name="email" type="email" class="input-field" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="reg-password">Password</label>
            <input id="reg-password" name="password" type="password" class="input-field" autocomplete="new-password" required />
          </div>
          <div class="form-field">
            <label for="reg-password2">Confirm password</label>
            <input id="reg-password2" name="password2" type="password" class="input-field" autocomplete="new-password" required />
          </div>
          <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </main>
  </body>
</html>
